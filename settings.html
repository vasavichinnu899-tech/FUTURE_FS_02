<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Settings</title>

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

<div class="dashboard">

    <aside class="sidebar">

        <div>

            <div class="logo">

                <h2>Vortex CRM</h2>

                <p>Settings Center</p>

            </div>

            <div class="menu">

                <a href="index.html">
                    Dashboard
                </a>

                <a href="leads.html">
                    Leads
                </a>

                <a href="analytics.html">
                    Analytics
                </a>

                <a href="reports.html">
                    Reports
                </a>

                <a href="settings.html"
                   class="active">
                    Settings
                </a>

            </div>

        </div>

    </aside>

    <main class="main-content">

        <header class="topbar">

            <div>

                <h1>
                    System Settings
                </h1>

                <p>
                    Configure your CRM preferences and profile.
                </p>

            </div>

        </header>

        <section class="settings-grid">

            <div class="settings-card">

                <h3>
                    Profile Settings
                </h3>

                <div class="profile-settings">

                    <div class="big-profile">
                        V
                    </div>

                    <h2>Vasavi</h2>

                    <p>
                        CRM Administrator
                    </p>

                </div>

            </div>

            <div class="settings-card">

                <h3>
                    Theme Settings
                </h3>

                <button class="theme-btn">
                    Dark Mode
                </button>

                <button class="theme-btn">
                    Blue Theme
                </button>

                <button class="theme-btn">
                    Purple Theme
                </button>

            </div>

            <div class="settings-card">

                <h3>
                    Notification Settings
                </h3>

                <div class="setting-item">

                    <span>Email Notifications</span>

                    <input type="checkbox" checked>

                </div>

                <div class="setting-item">

                    <span>Weekly Reports</span>

                    <input type="checkbox" checked>

                </div>

                <div class="setting-item">

                    <span>Lead Alerts</span>

                    <input type="checkbox">

                </div>

            </div>

            <div class="settings-card">

                <h3>
                    Security Settings
                </h3>

                <button class="save-btn">
                    Change Password
                </button>

                <button class="save-btn">
                    Two-Factor Authentication
                </button>

            </div>

        </section>

    </main>

</div>

</body>
</html>
